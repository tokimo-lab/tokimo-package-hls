uuid = { version = "1", features = ["v4"] }
tokimo-package-ffmpeg = { git = "https://github.com/tokimo-lab/tokimo-package-ffmpeg", rev = "9ea65ce92ead37f4fff80c9d4bdcd43e03622ee3" }
notify = "8"

